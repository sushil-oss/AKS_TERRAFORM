name: Terraform Azure VM Deploy

on:
  workflow_dispatch:

jobs:

  terraform-init:

    name: Terraform Init
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          echo "===================================="
          echo "Current Directory"
          echo "===================================="
          pwd

          echo ""
          echo "===================================="
          echo "Root Files"
          echo "===================================="
          ls -la

          echo ""
          echo "===================================="
          echo "All Directories"
          echo "===================================="
          find . -maxdepth 5 -type d | sort

          echo ""
          echo "===================================="
          echo "All Terraform Files"
          echo "===================================="
          find . -type f \( -name "*.tf" -o -name "*.tfvars" \) | sort

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

